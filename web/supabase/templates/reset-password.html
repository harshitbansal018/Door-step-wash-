<!-- Supabase → Authentication → Email Templates → "Reset Password". Subject: Your ShineDoor password reset code -->
<div style="font-family:Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#0f172a">
  <p style="font-size:18px;font-weight:700;color:#2563eb;margin:0 0 24px">ShineDoor</p>
  <h1 style="font-size:20px;margin:0 0 12px">Reset your password</h1>
  <p style="font-size:14px;line-height:22px;margin:0 0 20px">Enter this code to choose a new password:</p>
  <p style="font-size:32px;font-weight:700;letter-spacing:8px;background:#eff6ff;border-radius:12px;padding:16px;text-align:center;margin:0 0 20px">{{ .Token }}</p>
  <p style="font-size:13px;color:#64748b;line-height:20px;margin:0">
    The code expires in 10 minutes. If you didn't ask to reset your password, ignore this email — your password stays the same.
  </p>
</div>
